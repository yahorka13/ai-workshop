# Mutation testing of the backend's and the ui's whole source, run only when a
# person starts it: gh workflow run mutation -R "$(bin/repo)" (main by default,
# --ref for another branch). It has no schedule, so no copy of this template
# runs it unasked. This is the only place mutation testing runs: no pull request
# check, bin/check or hook runs it, and agents do not run bin/mutate while
# working, because a run takes hours. Each run's score and surviving mutants go
# to its summary, and its reports are uploaded.
name: Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

# A run that is still going is never cancelled by the next one.
concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # a whole-source run takes hours; GitHub's cap for a hosted job
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mutate
        # GitHub's default step shell has no pipefail; without it tee's status would pass the step.
        run: set -o pipefail; bin/mutate "$SERVICE" | tee "$RUNNER_TEMP/mutate.log"
        env:
          SERVICE: ${{ matrix.service }}
      - name: summary
        if: ${{ !cancelled() }}
        run: |
          summary="$(sed -n 's/^Reports: //p' "$RUNNER_TEMP/mutate.log" 2>/dev/null || true)/summary.md"
          echo "## $SERVICE" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary: the run stopped before reporting; see the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SERVICE: ${{ matrix.service }}
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.service }}
          path: tmp/mutate/${{ matrix.service }}/
          if-no-files-found: ignore
          retention-days: 14

  # The Docker-backed proof of bin/mutate itself (bin/tests/mutate.e2e.sh --help).
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/tests/mutate.e2e.sh
      - name: logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-harness
          path: tmp/mutate-proof/
          if-no-files-found: ignore
          retention-days: 14
