server {
  listen 3000;
  server_tokens off;
  absolute_redirect off; # keep the port the browser used, not 3000
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Source maps are for error reporting only, never public.
  location ~ \.map$ {
    return 404;
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # The component gallery (Storybook): its own files only, never the app.
  location = /storybook {
    return 301 /storybook/;
  }

  location /storybook/ {
    add_header Cache-Control "no-cache"; # its files keep their names across builds
    try_files $uri $uri/ =404;
  }

  # Client-side routes: unknown paths get the app entry page.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
