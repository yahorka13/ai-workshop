[test]
coverageThreshold = { lines = 1, functions = 1 }
coverageReporter = ["text", "lcov"]
# Test fixture construction is test infrastructure, not production source.
# contracts/ is generated by bin/contracts generate and holds no code; coverage
# scans only src/, and the contracts gate checks the generated files.
# tooling/migrate.ts is the migration entry: its top-level block opens a real
# connection, so it is proven by bin/tests/db-migrate.e2e.sh against the pinned
# PostgreSQL and by a spawned --help run, not by in-process coverage.
# tooling/seed.ts is the seed entry: it opens a real connection; src/seed.ts
# holds the logic and is covered, and bin/up runs the entry on a real stack.
# tooling/generate.ts only spawns drizzle-kit and calls the pruning in
# tooling/snapshots.ts, which is covered; the entry is proven by spawned runs.
# tooling/mutate.ts only spawns Stryker and calls tooling/mutation-report.ts,
# which is covered; the entry is proven by bin/tests/mutate.e2e.sh.
coveragePathIgnorePatterns = ["tests/**", "tooling/migrate.ts", "tooling/generate.ts", "tooling/seed.ts", "tooling/mutate.ts"]
